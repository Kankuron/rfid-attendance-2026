<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Smart ID Attendance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- =====================================================
         ALREADY-LOGGED-IN GUARD — if a valid session already
         exists, skip straight to the dashboard instead of
         showing the login form again.
    ====================================================== -->

    <script>
        (function () {

            var SESSION_KEY = "attendance_admin_session";

            function getSession() {

                try {

                    var raw =
                        localStorage.getItem(SESSION_KEY) ||
                        sessionStorage.getItem(SESSION_KEY);

                    return raw ? JSON.parse(raw) : null;

                } catch (error) {

                    return null;

                }

            }

            var session = getSession();

            var isValid =
                session &&
                session.access_token &&
                session.expires_at &&
                session.expires_at > Date.now();

            if (isValid) {

                window.location.replace("index.html");

            }

        })();
    </script>


    <div class="login-bg"></div>


    <div class="login-wrap">

        <div class="login-card">

            <div class="login-logo">🎓</div>

            <h1>Smart ID Attendance</h1>

            <p class="login-subtitle">
                RFID Monitoring System
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="input-icon-wrap">

                        <span class="input-icon">✉️</span>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="admin@example.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-icon-wrap">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePasswordBtn"
                            class="input-icon-btn"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="rememberMeCheckbox"
                    >

                    Remember me

                </label>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <button
                    type="submit"
                    id="loginSubmitBtn"
                    class="btn primary-btn login-submit"
                >
                    Sign In
                </button>

            </form>


            <p class="login-footer-note">
                🔒 Secured by Supabase Authentication
            </p>

        </div>

    </div>


    <div
        id="toast"
        class="toast"
    >
        Message
    </div>


    <script src="login.js"></script>

</body>
</html>
